services:
  db:
    image: postgres:16-alpine
    # Nom fixe : plus simple à cibler avec `docker exec`/`docker start`
    # que le nom auto-généré par défaut ("backend-db-1", dépendant du
    # dossier).
    container_name: koko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: koko
      POSTGRES_PASSWORD: koko_local_dev
      POSTGRES_DB: koko
    ports:
      # 5533 (anciennement 5433, change le 2026-09-15 : conflit avec un
      # autre conteneur Postgres local sur 5433) : si tu as deja un
      # PostgreSQL local, les deux cohabitent sans conflit.
      - "5533:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
    name: koko_v3_db_data
