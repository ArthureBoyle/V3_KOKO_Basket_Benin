<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>KOKO</title>
    <!--
      Theme ET commutateur "animations reduites" appliques AVANT le premier
      affichage, pour le meme motif : sans ca, la page s'afficherait une
      fraction de seconde dans l'etat par defaut puis changerait (flash).
      Memes valeurs et memes cles que src/theme/theme.ts et
      src/theme/preferences.ts.
    -->
    <script>
      try {
        var t = localStorage.getItem('koko-theme')
        document.documentElement.dataset.theme =
          t === 'terre' || t === 'menthe' ? t : 'violet'
      } catch (e) {
        document.documentElement.dataset.theme = 'violet'
      }
      try {
        document.documentElement.dataset.animationsReduites =
          localStorage.getItem('koko-animations-reduites') === 'oui' ? 'oui' : 'non'
      } catch (e) {
        document.documentElement.dataset.animationsReduites = 'non'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
